name: Build 0456K Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Extract client source
        run: |
          mkdir client
          unzip -q 0456K-Client-1.21.11-v2.5-source.zip -d client

      - name: Make Gradle executable
        working-directory: client
        run: chmod +x gradlew

      - name: Build client
        working-directory: client
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: 0456K-Client-1.21.11
          path: client/build/libs/*.jar
          if-no-files-found: error
